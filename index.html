<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Pitch Trainer</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-color: #ffffff;
      --accent-color: #007aff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background-color 0.5s ease;
      overflow: hidden;
    }

    /* Rainbow Animation for Hard Mode Win */
    @keyframes rainbowAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.rainbow-bg {
      background: linear-gradient(124deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
      background-size: 1800% 1800%;
      animation: rainbowAnimation 6s ease infinite;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    header {
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .mode-toggle {
      display: inline-flex;
      background: var(--card-bg);
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: #888;
      padding: 8px 16px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      background: var(--accent-color);
      color: white;
    }

    /* Mystery / Reveal Card */
    .card {
      width: 260px;
      height: 260px;
      margin: 0 auto 2rem auto;
      background: #000;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      border: 2px solid #333;
      transition: all 0.3s ease;
    }

    .card .icon {
      font-size: 5rem;
      font-weight: bold;
      color: #555;
    }

    .card .revealed-text {
      display: none;
      font-size: 3.5rem;
      font-weight: 800;
      color: #000;
      text-shadow: 0 2px 10px rgba(255,255,255,0.3);
    }

    .card .sub-text {
      display: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #111;
      margin-top: 8px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      background: var(--card-bg);
      color: white;
      border: 1px solid #333;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: #2a2a32;
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--accent-color);
      border: none;
    }

    .btn-primary:hover {
      background: #0062cc;
    }

    .btn-success {
      background: #34c759;
      border: none;
      color: black;
    }

    .btn-success:hover {
      background: #28a745;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Pitch Trainer</h1>
      <div class="mode-toggle">
        <button class="mode-btn active" id="easyModeBtn" onclick="setMode('easy')">Easy (Notes)</button>
        <button class="mode-btn" id="hardModeBtn" onclick="setMode('hard')">Hard (Chords)</button>
      </div>
    </header>

    <!-- Center Card -->
    <div class="card" id="displayCard">
      <div class="icon" id="cardIcon">?</div>
      <div class="revealed-text" id="cardTitle"></div>
      <div class="sub-text" id="cardSubtitle"></div>
    </div>

    <!-- Interactive Buttons -->
    <div class="controls">
      <button class="btn btn-primary" id="startBtn" onclick="startRound()">🔊 Start Round</button>
      <button class="btn hidden" id="replayBtn" onclick="replaySound()">🔄 Replay Sound</button>
      <button class="btn btn-success hidden" id="revealBtn" onclick="revealAnswer()">💡 Reveal Answer</button>
      <button class="btn hidden" id="nextBtn" onclick="startRound()">➡️ Next Challenge</button>
    </div>
  </div>

  <script>
    // Audio Context Setup
    let audioCtx = null;

    // Notes Data (10 Notes: C4 to E5)
    const NOTES = [
      { name: "C4", freq: 261.63, color: "rgb(102, 204, 0)", textColor: "#FFFFFF" },
      { name: "D4", freq: 294.66, color: "rgb(0, 155, 143)", textColor: "#FFFFFF" },
      { name: "E4", freq: 329.63, color: "rgb(1, 113, 187)", textColor: "#FFFFFF" },
      { name: "F4", freq: 349.23, color: "rgb(43, 46, 135)", textColor: "#FFFFFF" },
      { name: "G4", freq: 392.00, color: "rgb(236, 0, 139)", textColor: "#FFFFFF" },
      { name: "A4", freq: 440.00, color: "rgb(236, 0, 139)", textColor: "#FFFFFF" },
      { name: "B4", freq: 493.88, color: "rgb(255, 241, 0)", textColor: "#000000" },
      { name: "C5", freq: 523.25, color: "rgb(132, 234, 30)", textColor: "#000000" },
      { name: "D5", freq: 587.33, color: "rgb(30, 185, 173)", textColor: "#000000" },
      { name: "E5", freq: 659.25, color: "rgb(31, 143, 217)", textColor: "#FFFFFF" }
    ];

    // Chords Data
    const CHORDS = [
      { name: "C Major", notes: [0, 2, 4] }, // C4, E4, G4
      { name: "D minor", notes: [1, 3, 5] }, // D4, F4, A4
      { name: "E minor", notes: [2, 4, 6] }, // E4, G4, B4
      { name: "C Major (Upper)", notes: [7, 9, 4] } // C5, E5, G4
    ];

    let currentMode = "easy";
    let currentTarget = null;
    let isPlayingAudio = false;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    // Piezo-Style Tone Generator (Square Wave) with Smooth Envelope
    function playTone(freq, duration = 1.0, delay = 0) {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (!audioCtx) return resolve();

          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc.type = "square"; // Matches Arduino piezo timbre
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

          // Smooth envelope to sustain note longer without harsh clicks
          gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.05); // Smooth attack
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime + duration - 0.2); // Sustain tone length
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); // Soft release

          osc.connect(gain);
          gain.connect(audioCtx.destination);

          osc.start();
          osc.stop(audioCtx.currentTime + duration);

          setTimeout(resolve, duration * 1000);
        }, delay * 1000);
      });
    }

    // Plays the full note intro sequence (longer sustain for scale)
    async function playIntroScale() {
      for (let i = 0; i < NOTES.length; i++) {
        await playTone(NOTES[i].freq, 0.45);
      }
      await new Promise(r => setTimeout(r, 400));
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById("easyModeBtn").classList.toggle("active", mode === "easy");
      document.getElementById("hardModeBtn").classList.toggle("active", mode === "hard");
      resetUI();
    }

    function resetUI() {
      document.body.className = "";
      document.body.style.backgroundColor = "var(--bg-color)";
      
      const card = document.getElementById("displayCard");
      card.style.backgroundColor = "#000000";
      card.style.borderColor = "#333333";
      
      document.getElementById("cardIcon").style.display = "block";
      document.getElementById("cardTitle").style.display = "none";
      document.getElementById("cardSubtitle").style.display = "none";

      document.getElementById("startBtn").classList.remove("hidden");
      document.getElementById("replayBtn").classList.add("hidden");
      document.getElementById("revealBtn").classList.add("hidden");
      document.getElementById("nextBtn").classList.add("hidden");
    }

    async function startRound() {
      initAudio();
      resetUI();
      isPlayingAudio = true;

      document.getElementById("startBtn").classList.add("hidden");
      document.getElementById("nextBtn").classList.add("hidden");

      // 1. Play Scale Intro
      await playIntroScale();

      // 2. Select & Play Target
      if (currentMode === "easy") {
        const randomIndex = Math.floor(Math.random() * NOTES.length);
        currentTarget = NOTES[randomIndex];
        await playTone(currentTarget.freq, 2.0); // Held for 2.0 seconds
      } else {
        const randomIndex = Math.floor(Math.random() * CHORDS.length);
        currentTarget = CHORDS[randomIndex];
        
        // Play 3 notes individually (0.8s each)
        for (let idx of currentTarget.notes) {
          await playTone(NOTES[idx].freq, 0.8);
        }
        await new Promise(r => setTimeout(r, 300));

        // Play chord simultaneously (2.5s duration)
        playChordSimultaneously(currentTarget, 2.5);
        await new Promise(r => setTimeout(r, 2500));
      }

      isPlayingAudio = false;

      // Show Action Buttons
      document.getElementById("replayBtn").classList.remove("hidden");
      document.getElementById("revealBtn").classList.remove("hidden");
    }

    function playChordSimultaneously(chord, duration = 2.5) {
      chord.notes.forEach(idx => {
        playTone(NOTES[idx].freq, duration);
      });
    }

    async function replaySound() {
      if (isPlayingAudio || !currentTarget) return;
      isPlayingAudio = true;

      if (currentMode === "easy") {
        await playTone(currentTarget.freq, 2.0); // Held for 2.0 seconds
      } else {
        for (let idx of currentTarget.notes) {
          await playTone(NOTES[idx].freq, 0.8);
        }
        await new Promise(r => setTimeout(r, 300));
        playChordSimultaneously(currentTarget, 2.5);
      }

      isPlayingAudio = false;
    }

    function revealAnswer() {
      if (!currentTarget) return;

      const card = document.getElementById("displayCard");
      const icon = document.getElementById("cardIcon");
      const title = document.getElementById("cardTitle");
      const subtitle = document.getElementById("cardSubtitle");

      icon.style.display = "none";
      title.style.display = "block";

      if (currentMode === "easy") {
        // Single Note Reveal
        document.body.style.backgroundColor = currentTarget.color;
        card.style.backgroundColor = currentTarget.color;
        card.style.borderColor = "#FFFFFF";

        title.textContent = currentTarget.name;
        title.style.color = currentTarget.textColor;
        subtitle.style.display = "none";

        // Replay note for 2.0 seconds on reveal
        playTone(currentTarget.freq, 2.0);
      } else {
        // Chord Reveal
        document.body.className = "rainbow-bg";
        card.style.backgroundColor = "#FFFFFF";
        card.style.borderColor = "#FFFFFF";

        title.textContent = currentTarget.name;
        title.style.color = "#000000";

        const noteNames = currentTarget.notes.map(i => NOTES[i].name).join(" – ");
        subtitle.textContent = noteNames;
        subtitle.style.display = "block";

        // Replay chord for 2.5 seconds on reveal
        playChordSimultaneously(currentTarget, 2.5);
      }

      document.getElementById("revealBtn").classList.add("hidden");
      document.getElementById("nextBtn").classList.remove("hidden");
    }
  </script>
</body>
</html>
